name: Debug tests
on:
  push:
    branches: [codex/importar-planificacion-2026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas con reporte JSON
        run: npm test -- --reporter=json --outputFile=test-results.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json
