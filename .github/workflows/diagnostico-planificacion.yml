name: Diagnóstico temporal planificación 2026

on:
  pull_request:
    branches:
      - main

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico compacto
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch "$GITHUB_HEAD_REF" "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          npm ci --silent
          node --input-type=module -e 'import("./src/data/seedActividades.js").then(({baseActividadesPlan}) => console.log("TOTAL_ACTIVIDADES=" + baseActividadesPlan.length))'
          npm test -- --run --reporter=dot
